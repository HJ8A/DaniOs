font_family JetBrainsMono Nerd Font
font_size 12

background_opacity 0.65
background_blur 1

cursor_shape block
cursor_blink_interval 0
cursor_text_color #000000
cursor_stop_blinking_after 0

# Estela del cursor (efecto tipo SmearCursor de VS Code)
# trail: ms que el cursor debe estar quieto antes de volver a animar (0 = off)
# decay: segundos que tarda la estela en alcanzar al cursor (rápido lento)
# threshold: celdas mínimas de salto para mostrar la estela
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

enable_audio_bell no
confirm_os_window_close 0

window_padding_width 16

# Copiar al seleccionar y pegar con rueda del mouse (portapapeles primario)
copy_on_select primary
mouse_map middle release ungrabbed paste_from_selection

# Atajos alternativos de pegado
map ctrl+shift+v paste_from_clipboard
map shift+insert  paste_from_selection
